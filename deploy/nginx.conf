# Serves the static dist/ for one client. TLS, domains, and compression-at-the-edge
# are Traefik's job (Dokploy fronts every app with it); this container only speaks
# plain HTTP on 80.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Migration 301s translated from the client's _redirects at build time.
    include /etc/nginx/snippets/redirects.conf;

    # Astro emits directory-format URLs (/about/ -> /about/index.html).
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Hashed build assets are immutable; everything else revalidates.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2?|mp4|webm)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
